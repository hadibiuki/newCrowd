clear_cdn_cache:
  stage: clear_cdn_cache
  interruptible: true
  script:
    - sudo ssh -p 8443 root@45.89.136.40 "rm -rf /opt/nginx-cdn-compose/cache/next.zarinpal.com/*" && echo "cache removed successfully on cdn-rack-3"
    - sudo ssh -p 8443 root@45.89.137.18 "rm -rf /opt/nginx-cdn-compose/cache/next.zarinpal.com/*" && echo "cache removed successfully on cdn-rack-2"
  tags:
    - Runner-Static-shell
  only:
    - tags
  when: manual

quality_test:
  stage: deploy
  extends: .docker_login
  script:
    - docker compose -f docker-compose-quality-test.yml up --pull always
  tags:
    - Runner-Static
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $custom_branch_env == "develop"'
      changes:
        - apps/shell/**/*
    - when: never
