    variables:
      - $CI_COMMIT_TAG =~ /.*kyc-.*/
      #- $CI_COMMIT_BRANCH == 'main'
    changes:
      - apps/zarin-kyc/**/*

deploy_prod_shell:
  <<: *deploy_template
  variables:
