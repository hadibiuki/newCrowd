  <<: *deploy_template
  variables:
    KUBE_CONFIG: ${kube_config_prod}
    RELEASE_NAME: ${project_name}-kyc
    NAMESPACE: panel-monorepo
    VALUES_PATH: ./deployment/product/values-kyc.yaml
  stage: deploy
  tags:
    - Runner-Static
